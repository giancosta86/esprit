buildscript {
    repositories {
        maven {
            url 'https://dl.bintray.com/giancosta86/Hephaestus'
        }

        jcenter()
    }

    dependencies {
        classpath 'info.gianlucacosta.moonlicense:moonlicense-gradle:5.0'
        classpath 'info.gianlucacosta.aurora:aurora:9.1'
    }
}


apply plugin: 'java'
apply plugin: 'application'
apply plugin: 'info.gianlucacosta.moonlicense'
apply plugin: 'info.gianlucacosta.aurora'


group 'info.gianlucacosta.esprit'
archivesBaseName = "esprit"
version '1.0'


sourceCompatibility = 1.8


description = 'Data Mining on the GLAWI French lexicon'

mainClassName = 'info.gianlucacosta.esprit.App'



dependencies {
    compile 'info.gianlucacosta.rayon:rayon:1.0'

    compile 'com.google.code.gson:gson:2.8.2'
}


moonLicense {
    license = apache2

    productInfo {
        productName = 'Esprit'
        inceptionYear = 2018
        copyrightHolder = 'Gianluca Costa'
    }
}


aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }

    commandLineApp = true
}
