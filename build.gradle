buildscript {
    repositories {
        //TODO! Del this!
        mavenLocal()

        mavenCentral()
    }

    dependencies {
        classpath 'info.gianlucacosta.aurora:aurora:10.0.0-SNAPSHOT'
    }
}


apply plugin: 'java'
apply plugin: 'application'
apply plugin: 'info.gianlucacosta.aurora'


group 'info.gianlucacosta.esprit'
archivesBaseName = "esprit"
version '2.0.0-SNAPSHOT'


sourceCompatibility = 1.8


description = 'Data Mining on the GLAWI French lexicon'

mainClassName = 'info.gianlucacosta.esprit.App'


dependencies {
    compile 'info.gianlucacosta.rayon:rayon:2.0.0-SNAPSHOT'

    compile 'com.google.code.gson:gson:2.8.2'
}


aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }

    commandLineApp = true
}
